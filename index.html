<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF6EC">
<title>The Keyring · Week 5 Mission Edition</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 15% 15%,rgba(42,157,143,.12),transparent 30%),radial-gradient(circle at 85% 12%,rgba(231,111,81,.12),transparent 30%),#FAF6EC;color:#2B2620;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loader{width:min(560px,86vw);text-align:center;padding:28px}.key{width:90px;height:90px;margin:0 auto 24px;position:relative;animation:float 2.4s ease-in-out infinite}.key:before{content:"";position:absolute;width:42px;height:42px;border:7px solid #E76F51;border-radius:50%;left:0;top:20px}.key:after{content:"";position:absolute;width:58px;height:9px;background:#1D3557;left:41px;top:38px;box-shadow:29px 10px 0 -1px #1D3557,43px 18px 0 -1px #1D3557}.title{font:700 clamp(1.35rem,4vw,2.1rem) Georgia,serif;color:#1D3557}.sub{color:#6B6355;line-height:1.55;margin:12px auto 0;max-width:480px}.bar{height:7px;border-radius:99px;background:#EDE5D2;overflow:hidden;margin-top:24px}.bar:after{content:"";display:block;width:42%;height:100%;background:linear-gradient(90deg,#2A9D8F,#E76F51,#C9932F);animation:load 1.15s ease-in-out infinite}.tiny{margin-top:12px;font:600 .72rem ui-monospace,monospace;color:#2A9D8F}.error{display:none;margin-top:16px;padding:12px;border:1px solid #C0392B;border-radius:10px;color:#C0392B;background:rgba(192,57,43,.05);font-size:.85rem}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(250%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="loader"><div class="key"></div><div class="title">THE KEYRING · MISSION EDITION</div><p class="sub">Loading interactive key lifecycle labs, distribution decisions, KDC exchange, MITM defence, certificate trust checks and revocation missions…</p><div class="bar"></div><div class="tiny">COMP6013 · WEEK 5</div><div class="error" id="error"></div></div>
<script>
(async()=>{
  try{
    if('scrollRestoration' in history) history.scrollRestoration='manual';
    window.scrollTo(0,0);
    const parts=['site1.b64','site2.b64','site3.b64','site4.b64'];
    const rs=await Promise.all(parts.map(p=>fetch('./'+p,{cache:'no-store'})));
    rs.forEach((r,i)=>{if(!r.ok) throw new Error(`Site payload ${i+1} failed to load (${r.status}).`)});
    const encoded=(await Promise.all(rs.map(r=>r.text()))).map(x=>x.trim()).join('');
    if(!encoded.startsWith('H4sI')) throw new Error('Website payload is incomplete.');
    if(typeof DecompressionStream==='undefined') throw new Error('Please use a current Chrome, Edge, Firefox or Safari browser.');
    const bin=atob(encoded), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('Mission Edition') || !html.includes('missionDistribution') || !html.includes('missionMitm')) throw new Error('Enhanced website payload failed validation.');
    document.open();document.write(html);document.close();
    requestAnimationFrame(()=>window.scrollTo(0,0));
  }catch(err){const b=document.getElementById('error');b.textContent=err?.message||'Unable to load the interactive site.';b.style.display='block';}
})();
</script>
</body>
</html>
